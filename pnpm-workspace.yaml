packages:
  - front
  - nest-api

allowBuilds:
  '@prisma/engines': true
  # Optional native accelerator for ssh2. Pure-JS crypto is the fallback and
  # works fine; not worth a compiler on the deploy host.
  cpu-features: false
  esbuild: true
  prisma: true
  sharp: true
  ssh2: true
  unrs-resolver: true

onlyBuiltDependencies:
  - "@biomejs/biome"
  - "@nestjs/core"
  - "@prisma/engines"
  - esbuild
  - prisma
  - ssh2
  - sharp
  - unrs-resolver

# House rule: TypeScript stays on the latest 5.x. The Nest 12 CLI asks for ~6.0; it builds fine on
# 5.9.3, so the whole workspace is held there (TRE-155).
overrides:
  typescript: 5.9.3
