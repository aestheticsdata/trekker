# Secret scanning (TRE-5 §4).
#
# CI is the guarantee, the pre-commit hook is only the convenience: hooks live
# in .git/ and are never cloned, so a fresh checkout has no protection until
# someone runs `pnpm hooks:install`. This runs whatever the state of anyone's
# workstation.
#
# The whole history is scanned, not just the push range. A secret committed once
# and removed later is still published, and this repo is public — so the useful
# question is "is it anywhere in the history", asked on every push, rather than
# "was it added in these commits".

name: security

on:
  push:
    branches: ["**"]
  pull_request:
  # A finding can appear without a push — but only when the pin below moves, so
  # this run is a liveness check on the job itself rather than on the rules:
  # it fails the week the release URL, the asset name or the CLI changes under
  # us, instead of on the next push after that.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Every commit, so the scan can see history rather than one diff.
          fetch-depth: 0
          # Otherwise checkout leaves GITHUB_TOKEN in .git/config, where the
          # scanner binary this job downloads at run time could read it. This
          # job only reads the tree it already has.
          persist-credentials: false

      - name: Install gitleaks
        env:
          # Pinned: an unpinned scanner is an unreviewed binary in a security
          # job. Bump deliberately.
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o checksums.txt \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          # Guards against a truncated or tampered download, not against a
          # compromised release — the checksums come from the same release.
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz\$" checksums.txt | sed 's/gitleaks.*/gitleaks.tar.gz/' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan history
        run: |
          set -euo pipefail
          # `gitleaks git` shells out to git and reports "no leaks found" when
          # git itself returns nothing — a shallow clone, a detached checkout or
          # a wrong working directory all read as a clean repository. Assert
          # there is history to scan before believing the result.
          commits=$(git rev-list --count --all)
          echo "history: ${commits} commits"
          [ "${commits}" -gt 1 ] || { echo "::error::refusing to pass on a ${commits}-commit history — checkout is shallow or wrong"; exit 1; }
          gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

      - name: Scan the working tree
        # Catches anything present but never committed — and, on a pull request,
        # the merge result rather than either side alone.
        run: gitleaks dir --config .gitleaks.toml --redact --verbose --exit-code 1 .
